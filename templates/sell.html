<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sell Shares</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/5.1.3/css/bootstrap.min.css">
</head>

<body>

    <div class="container mt-5">
        <h1 class="mb-3">Sell Shares</h1>
        <form action="/sell" method="post">
            <label for="quote" class="form-label fw-bold">Sell Shares</label>
            <select class="form-select mb-3" name="symbol">
                <option disabled selected>Select Symbol</option>
                {% for stock in portfolio %}
                <option>{{ stock["symbol"] }}</option>
                {% endfor %}
            </select>
            <input class="form-control mb-3" name="shares" type="number" placeholder="Shares" min="0" autocomplete="off">
            <button type="submit" class="btn btn-primary btn-sm">Sell</button>
        </form>
    </div>

</body>

</html>
