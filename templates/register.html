{% extends "layout.html" %}

{% block title %}
    Register
{% endblock %}

{% block main %}
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h2 class="text-center mb-4">Register</h2>
                <form action="/register" method="post">
                    <div class="mb-3">
                        <input autocomplete="off" class="form-control" id="username" name="username" placeholder="Username" type="text" required>
                    </div>
                    <div class="mb-3">
                        <input class="form-control" id="password" name="password" placeholder="Password" type="password" required>
                    </div>
                    <div class="mb-3">
                        <input class="form-control" id="confirmation" name="confirmation" placeholder="Confirm Password" type="password" required>
                    </div>
                    <div class="text-center">
                        <button class="btn btn-primary" type="submit">Register</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
