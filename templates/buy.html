<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Buy Shares</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/5.1.3/css/bootstrap.min.css">
</head>

<body>

    <div class="container mt-5">
        <h1 class="mb-3">Buy Shares</h1>
        <form action="/buy" method="post">
            <div class="mb-3">
                <label for="symbol" class="form-label fw-bold">Buy Shares</label>
                <input type="text" class="form-control mb-3" id="symbol" name="symbol" placeholder="Symbol" minlength="1" required>
                <input type="number" class="form-control mb-3" id="shares" name="shares" placeholder="Shares" min="1" required>
                <button type="submit" class="btn btn-primary btn-sm">Buy</button>
            </div>
        </form>
    </div>

</body>

</html>
